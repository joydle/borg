name: Feature request
description: Suggest a new primitive, capability, or API
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Borg has a small surface by design. Before requesting a
        feature, check whether existing primitives compose into
        what you need — if they do, that's likely the answer.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Start from the use case, not the proposed solution.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What does Borg make you do today?
      description: How does the current API force you to work around this?

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior change
      description: Optional. A sketch of what the API would look like.
      render: rust

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other crates, patterns, or workarounds you evaluated.
